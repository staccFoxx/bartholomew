name: 'Bartholomew Agentic Runtime Protection (ARP) CI/CD Action'
description: 'Ultra-fast (<20µs) deterministic AST invariant execution firewall, credential leak prevention, and cryptographic Ed25519 receipts for autonomous AI agents'
author: 'Bartholomew Security'

branding:
  icon: 'shield'
  color: 'blue'

inputs:
  audit-path:
    description: 'Target repository directory or file pattern to inspect'
    required: false
    default: '.'
  fail-on-violation:
    description: 'Fail the GitHub workflow if an invariant policy violation or exposed credential is found'
    required: false
    default: 'true'
  generate-sarif:
    description: 'Generate SARIF 2.1.0 report (bartholomew.sarif) for GitHub Code Scanning tab'
    required: false
    default: 'true'
  export-dossier:
    description: 'Export SOC 2 / ISO 27001 verifiable cryptographic compliance dossier'
    required: false
    default: 'false'
  export-telemetry:
    description: 'Export audit execution traces to OpenTelemetry (OTel) JSON artifact'
    required: false
    default: 'false'

outputs:
  compliance-status:
    description: 'SOC2_PASSED or INVARIANT_VIOLATION compliance verdict'
    value: ${{ steps.arp-gate.outputs.compliance-status }}
  audit-receipt-sha256:
    description: 'Cryptographic execution receipt SHA-256 digest'
    value: ${{ steps.arp-gate.outputs.audit-receipt-sha256 }}
  eval-latency-us:
    description: 'Average in-process evaluation latency in microseconds'
    value: ${{ steps.arp-gate.outputs.eval-latency-us }}

runs:
  using: 'composite'
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Bartholomew Guard
      shell: bash
      run: |
        python -m pip install --upgrade pip
        pip install btp-guard==6.4.3 cryptography pyyaml

    - name: Run Bartholomew Keystone ARP Gate
      id: arp-gate
      shell: bash
      run: |
        python ${{ github.action_path }}/entrypoint.py "${{ inputs.audit-path }}" "${{ inputs.fail-on-violation }}" "${{ inputs.generate-sarif }}" "${{ inputs.export-dossier }}"
