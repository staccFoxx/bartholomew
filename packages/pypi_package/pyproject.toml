[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "btp-guard"
version = "7.0.0"
authors = [
  { name="Bartholomew Security Contributors", email="security@bartholomew.info" },
]
description = "BTP v7.0.0 Universal Cryptographic Trust Guard & In-Process AST Gateway (Claude Code, Cursor, Windsurf, AutoGen, Semantic Kernel, LangGraph)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Topic :: Security",
    "Topic :: Scientific/Engineering :: Artificial Intelligence"
]
dependencies = [
    "cryptography>=41.0.0"
]

[project.urls]
Homepage = "https://bartholomew.info"
Documentation = "https://bartholomew.info/docs.html"
Repository = "https://github.com/staccFoxx/bartholomew"
Changelog = "https://bartholomew.info/whitepaper.html"
Tracker = "https://github.com/staccFoxx/bartholomew/issues"
