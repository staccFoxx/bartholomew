    <image href="https://raw.githubusercontent.com/staccFoxx/bartholomew/main/site/assets/promptsmith_mascot.png" x="-10" y="-6" width="110" height="110"/>
  </g>

  <!-- Feature callout tag at top right -->
  <g transform="translate(730, 70)">
    <rect x="0" y="0" width="220" height="42" rx="6" fill="rgba(234, 179, 8, 0.15)" stroke="#eab308" stroke-width="1"/>
    <text x="110" y="18" fill="#facc15" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11" font-weight="800" text-anchor="middle">DRAGGABLE IDE COMPANION</text>
    <text x="110" y="32" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="10" text-anchor="middle">Persistent position &bull; Zero clutter</text>
  </g>
</svg>