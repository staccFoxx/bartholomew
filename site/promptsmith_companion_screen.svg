      <text x="0" y="132" fill="#e2e8f0" font-family="monospace" font-size="12" font-style="italic">
        """
      </text>

      <text x="0" y="160" fill="#ff7b72" font-family="monospace" font-size="12">
        def <tspan fill="#d2a8ff">get_settlement_ledger</tspan>(account_id: str):
      </text>
      <text x="20" y="184" fill="#c9d1d9" font-family="monospace" font-size="12">
        with pool.getconn() as conn:
      </text>
      <text x="40" y="208" fill="#c9d1d9" font-family="monospace" font-size="12">
        cursor = conn.cursor()
      </text>
    </g>
  </g>

  <!-- VS Code Status Bar (Bottom) -->
  <rect x="25" y="574" width="950" height="26" rx="0" fill="#007acc"/>
  <text x="40" y="591" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11">
    main* &bull; UTF-8 &bull; Python 3.12 &bull; <tspan font-weight="700">$(sparkle) PromptSmith</tspan> &bull; $(key) &bull; $(shield-check)
  </text>

  <!-- DRAGGABLE MASCOT COMPANION OVERLAY -->
  <g transform="translate(680, 200)" filter="url(#mascotShadow)">
    <!-- Speech bubble -->
    <rect x="-80" y="-85" width="230" height="68" rx="8" fill="#0f172a" stroke="#eab308" stroke-width="1.5"/>
    <!-- Speech bubble pointer -->
    <polygon points="35,-17 45,-8 55,-17" fill="#0f172a" stroke="#eab308" stroke-width="1.5"/>
    <rect x="34" y="-19" width="22" height="4" fill="#0f172a"/>
    <text x="35" y="-62" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11" font-weight="700" text-anchor="middle">PromptSmith Assistant</text>
    <text x="35" y="-44" fill="#fbbf24" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11" text-anchor="middle">Press Alt+P to sharpen prompt!</text>
    <text x="35" y="-28" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="9" text-anchor="middle">Drag me anywhere on your screen &bull; v1.7.0</text>

