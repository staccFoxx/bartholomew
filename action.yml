name: "Bartholomew Guard — AI Agent & MCP Security Gate"
description: "Zero-dependency deterministic AST & static security scanner for AI agents and MCP servers. Flags shell injection, unconfined fs mutations, and unredacted secret reads (OWASP LLM02/LLM05/LLM06)."
author: "Bartholomew Security (bartholomew.info)"
branding:
  icon: "shield"
  color: "green"

inputs:
  path:
    description: "Directory to scan (relative to workspace root)"
    required: false
    default: "."
  fail-on-high:
    description: "Fail the workflow if any HIGH severity findings are detected"
    required: false
    default: "false"
  json-out:
    description: "Optional path to write machine-readable JSON findings"
    required: false
    default: "btp-guard-report.json"

outputs:
  findings-count:
    description: "Total number of security findings detected"
    value: ${{ steps.scan.outputs.findings_count }}
  high-count:
    description: "Number of HIGH severity findings detected"
    value: ${{ steps.scan.outputs.high_count }}
  grade:
    description: "Overall security grade (A+ to F)"
    value: ${{ steps.scan.outputs.grade }}

runs:
  using: "composite"
  steps:
    - name: Run Bartholomew Guard AST Security Scan
      id: scan
      shell: bash
      run: |
        python3 "${{ github.action_path }}/scripts/btp_guard_ci_scan.py" \
          --path "${{ inputs.path }}" \
          --json-out "${{ inputs.json-out }}" \
          $( [ "${{ inputs.fail-on-high }}" = "true" ] && echo "--fail-on-high" )
